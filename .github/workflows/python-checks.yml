name: Python portfolio checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fundamentals-and-notebooks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Python fundamentals tests
        run: python -m unittest discover -s tests -v
      - name: Check notebook JSON structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          notebooks = sorted(Path("data-analysis").rglob("*.ipynb"))
          assert notebooks, "No notebooks found"
          for path in notebooks:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data.get("nbformat") == 4, f"Invalid notebook format: {path}"
              assert isinstance(data.get("cells"), list), f"No cells: {path}"
              print(f"OK: {path} ({len(data['cells'])} cells)")
          PY
      - name: Confirm portable notebooks have no hard-coded Mac home paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          portable = sorted(Path("data-analysis/portable").glob("*.ipynb"))
          assert portable, "Missing portable notebook editions"
          for path in portable:
              notebook = json.loads(path.read_text(encoding="utf-8"))
              code = "\n".join(
                  "".join(cell.get("source", []))
                  for cell in notebook["cells"]
                  if cell.get("cell_type") == "code"
              )
              assert "/Users/santiago/" not in code, path
              assert "~/Downloads" not in code, path
              print("Portable code paths OK:", path)
          PY
